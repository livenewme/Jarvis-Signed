name: Export Jarvis Android public toolchain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-jarvis-android-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify hosted Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          java -version
          gradle --version
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -h >/dev/null 2>&1 || true

      - name: Warm public AGP and JUnit dependencies
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/jarvis-public-cache-warm
          rm -rf "$root"
          mkdir -p "$root/app/src/main/java/example" "$root/app/src/main"
          cat > "$root/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'JarvisPublicToolchainWarmup'
          include ':app'
          EOF
          cat > "$root/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > "$root/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'example.jarvis.toolchain'
              compileSdk 35
              defaultConfig {
                  applicationId 'example.jarvis.toolchain'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              testImplementation 'junit:junit:4.13.2'
          }
          EOF
          cat > "$root/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application /></manifest>
          EOF
          cat > "$root/app/src/main/java/example/Main.java" <<'EOF'
          package example; final class Main {}
          EOF
          cd "$root"
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Export deterministic local-build toolchain archive
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/out"
          stage=/tmp/jarvis-public-toolchain
          rm -rf "$out" "$stage"
          mkdir -p "$out" "$stage/android-sdk/platforms" "$stage/android-sdk/build-tools" "$stage/gradle-cache/caches"

          gradle_bin="$(readlink -f "$(command -v gradle)")"
          gradle_home="$(dirname "$(dirname "$gradle_bin")")"
          test -x "$gradle_home/bin/gradle"

          cp -a "$JAVA_HOME" "$stage/jdk17"
          cp -a "$gradle_home" "$stage/gradle-8.9"
          cp -a "$ANDROID_HOME/platforms/android-35" "$stage/android-sdk/platforms/android-35"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$stage/android-sdk/build-tools/35.0.0"
          if [ -d "$ANDROID_HOME/platform-tools" ]; then
            cp -a "$ANDROID_HOME/platform-tools" "$stage/android-sdk/platform-tools"
          fi
          cp -a "$HOME/.gradle/caches/modules-2" "$stage/gradle-cache/caches/modules-2"

          cat > "$stage/TOOLCHAIN.txt" <<EOF
          java_version=17
          gradle_version=8.9
          android_platform=35
          android_build_tools=35.0.0
          agp_version=8.7.3
          junit_version=4.13.2
          runner=ubuntu-24.04
          EOF

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$stage" -czf "$out/jarvis-android-public-toolchain.tar.gz" .
          sha256sum "$out/jarvis-android-public-toolchain.tar.gz" \
            > "$out/jarvis-android-public-toolchain.tar.gz.sha256"
          du -h "$out/jarvis-android-public-toolchain.tar.gz"
          cat "$out/jarvis-android-public-toolchain.tar.gz.sha256"

      - name: Upload public toolchain
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-public-toolchain
          path: out/
          if-no-files-found: error
          retention-days: 7
