name: Publish Jarvis v0.2.0 once

on:
  push:
    branches: [main]
    paths:
      - '.release-trigger-v020'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact CI input and publish exact signed APK
        shell: bash
        env:
          ARTIFACT_URL: 'https://sdmntprwestus.oaiusercontent.com/files/00000000-e54c-8230-b0e1-6f173dc43aa3/raw?se=2026-08-26T01%3A24%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=2156ba57-41ad-5e6c-9569-4eb73f6bc3ff&skoid=89c13f8f-c33a-46d8-9bf3-ad7158c7790a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-25T23%3A05%3A04Z&ske=2026-08-26T23%3A05%3A04Z&sks=b&skv=2026-02-06&sig=scxvQvDakHSCsibknlzDtZw9CVTumVUPzvxZSXmcNtk%3D'
          UNSIGNED_SHA: '16880e73a3c1535833664693a50d980aa7ec05ee806c52942682c92ef01f7805'
          UNSIGNED_SIZE: '30508'
          EXPECTED_SHA: 'e81761f33d09d2172de1e5ba5c2a9aba8491af1c69deec574e74ba9d9efe4cb2'
          EXPECTED_SIZE: '41688'
          PATCH_ZLIB_B64: ''
        run: |
          set -euo pipefail
          curl -fL "$ARTIFACT_URL" -o /tmp/ci.zip
          mkdir -p /tmp/ci
          unzip -q /tmp/ci.zip -d /tmp/ci
          UNSIGNED=/tmp/ci/app-release-unsigned.apk
          test -f "$UNSIGNED"
          test "$(stat -c%s "$UNSIGNED")" = "$UNSIGNED_SIZE"
          echo "$UNSIGNED_SHA  $UNSIGNED" | sha256sum -c -

          python3 - <<'PY'
          import base64, os, pathlib, zlib
          u = pathlib.Path('/tmp/ci/app-release-unsigned.apk').read_bytes()
          p1 = base64.b64decode('CQ==')
          i1 = base64.b64decode('NdkFAAQAAAA=')
          i2 = zlib.decompress(base64.b64decode(os.environ['PATCH_ZLIB_B64']))
          p2 = base64.b64decode('AKA=')
          out = u[:27275] + p1 + u[27276:27291] + i1 + u[27291:29780] + i2 + u[29780:30502] + p2 + u[30504:]
          pathlib.Path('/tmp/Jarvis-v0.2.0-release-signed.apk').write_bytes(out)
          PY

          APK=/tmp/Jarvis-v0.2.0-release-signed.apk
          test "$(stat -c%s "$APK")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA  $APK" | sha256sum -c -
          unzip -tq "$APK"

          git config user.name 'Jarvis Release Bot'
          git config user.email 'jarvis-release-bot@users.noreply.github.com'
          git fetch origin release-feed main
          git worktree add /tmp/feed origin/release-feed
          cd /tmp/feed
          test ! -e releases/v0.2.0
          rm -rf staging/v0.2.0 staging-v0.2.0
          mkdir -p releases/v0.2.0
          cp "$APK" releases/v0.2.0/Jarvis-v0.2.0-release-signed.apk
          printf '%s  %s\n' "$EXPECTED_SHA" 'Jarvis-v0.2.0-release-signed.apk' > releases/v0.2.0/Jarvis-v0.2.0-release-signed.apk.sha256
          cat > releases/v0.2.0/README.md <<'EOF'
          Jarvis Android v0.2.0 / code2

          First standalone on-device Jarvis runtime. Runs as an Android foreground service with local durable events, direct model access, Keystore-protected credentials, and live runtime notification states.
          EOF
          git add -A staging/v0.2.0 staging-v0.2.0 releases/v0.2.0 2>/dev/null || git add -A
          git commit -m 'Publish Jarvis Android v0.2.0 APK'
          git push origin HEAD:release-feed

          cat > latest.json <<'EOF'
          {
            "versionName": "0.2.0",
            "versionCode": 2,
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Jarvis-Signed/release-feed/releases/v0.2.0/Jarvis-v0.2.0-release-signed.apk",
            "sha256": "e81761f33d09d2172de1e5ba5c2a9aba8491af1c69deec574e74ba9d9efe4cb2",
            "releaseCertSha256": "e2384592780978342912be64664d4ed53e392d8b0cb107d99a7b47b3423bc153",
            "releaseNotes": "Runs Jarvis entirely on-device as an Android foreground service with local durable event history, direct model access, Keystore-protected credentials, and live notification status for runtime activity."
          }
          EOF
          git add latest.json
          git commit -m 'Set Jarvis Android v0.2.0 as latest'
          git push origin HEAD:release-feed

          cd "$GITHUB_WORKSPACE"
          git rm .github/workflows/publish-v020.yml .release-trigger-v020
          git commit -m 'Remove one-shot Jarvis v0.2.0 publisher'
          git push origin HEAD:main
