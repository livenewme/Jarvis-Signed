name: Publish Jarvis v0.2.0 once

on:
  push:
    branches: [main]
    paths:
      - '.release-trigger-v020'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify staged signed APK and publish
        shell: bash
        env:
          EXPECTED_SHA: 'e81761f33d09d2172de1e5ba5c2a9aba8491af1c69deec574e74ba9d9efe4cb2'
          EXPECTED_SIZE: '41688'
        run: |
          set -euo pipefail
          git fetch origin release-feed main
          git worktree add /tmp/feed origin/release-feed
          cd /tmp/feed
          mkdir -p /tmp/jarvis-release
          cat staging-v0.2.0/part-* | base64 -d > /tmp/jarvis-release/Jarvis-v0.2.0-release-signed.apk
          APK=/tmp/jarvis-release/Jarvis-v0.2.0-release-signed.apk
          test "$(stat -c%s "$APK")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA  $APK" | sha256sum -c -
          unzip -tq "$APK"
          test ! -e releases/v0.2.0
          mkdir -p releases/v0.2.0
          cp "$APK" releases/v0.2.0/Jarvis-v0.2.0-release-signed.apk
          printf '%s  %s\n' "$EXPECTED_SHA" 'Jarvis-v0.2.0-release-signed.apk' > releases/v0.2.0/Jarvis-v0.2.0-release-signed.apk.sha256
          cat > releases/v0.2.0/README.md <<'EOF'
          Jarvis Android v0.2.0 / code2

          First standalone on-device Jarvis runtime. Runs as an Android foreground service with local durable events, direct model access, Keystore-protected credentials, and live runtime notification states.
          EOF
          git rm -r staging-v0.2.0 staging/v0.2.0 2>/dev/null || true
          git add releases/v0.2.0
          git config user.name 'Jarvis Release Bot'
          git config user.email 'jarvis-release-bot@users.noreply.github.com'
          git commit -m 'Publish Jarvis Android v0.2.0 APK'
          git push origin HEAD:release-feed

          cat > latest.json <<'EOF'
          {
            "versionName": "0.2.0",
            "versionCode": 2,
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Jarvis-Signed/release-feed/releases/v0.2.0/Jarvis-v0.2.0-release-signed.apk",
            "sha256": "e81761f33d09d2172de1e5ba5c2a9aba8491af1c69deec574e74ba9d9efe4cb2",
            "releaseCertSha256": "e2384592780978342912be64664d4ed53e392d8b0cb107d99a7b47b3423bc153",
            "releaseNotes": "Runs Jarvis entirely on-device as an Android foreground service with local durable event history, direct model access, Keystore-protected credentials, and live notification status for runtime activity."
          }
          EOF
          git add latest.json
          git commit -m 'Set Jarvis Android v0.2.0 as latest'
          git push origin HEAD:release-feed

          cd "$GITHUB_WORKSPACE"
          git rm .github/workflows/publish-v020.yml .release-trigger-v020
          git commit -m 'Remove one-shot Jarvis v0.2.0 publisher'
          git push origin HEAD:main
