name: Build Jarvis Codex native v0.3

on:
  push:
    branches: [ci/codex-native-v0.3]
    paths:
      - '.github/workflows/build-codex-native-v0.3.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare-v033-aligned-base:
    runs-on: ubuntu-latest
    env:
      BASE_RUN_ID: '33008045886'
      BASE_ARTIFACT: 'jarvis-v0.3.3-sandbox-enum-hotfix-unsigned'
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
      - name: Install Build Tools 35
        run: sdkmanager 'build-tools;35.0.0' >/dev/null
      - name: Download exact unsigned v0.3.3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/base out
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT" --dir /tmp/base
          BASE="$(find /tmp/base -name 'Jarvis-v0.3.3-sandbox-enum-hotfix-unsigned.apk' -print -quit)"
          test -n "$BASE"
          cp "$BASE" /tmp/base.apk
          echo '474a3a34344b15bf6d086e6986f723ae805668044bdd08367f803e6cf54e0639  /tmp/base.apk' | sha256sum -c -
      - name: Zipalign deterministic signing base
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 /tmp/base.apk out/Jarvis-v0.3.3-aligned-unsigned.apk
          "$BUILD_TOOLS/zipalign" -c -p 4 out/Jarvis-v0.3.3-aligned-unsigned.apk
          unzip -tq out/Jarvis-v0.3.3-aligned-unsigned.apk
          sha256sum out/Jarvis-v0.3.3-aligned-unsigned.apk | tee out/Jarvis-v0.3.3-aligned-unsigned.apk.sha256
      - name: Upload aligned base
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v0.3.3-aligned-unsigned
          path: out/
          if-no-files-found: error
