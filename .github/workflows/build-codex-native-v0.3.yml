name: Build Jarvis Codex native v0.3

on:
  push:
    branches: [ci/codex-native-v0.3]
    paths:
      - '.github/workflows/build-codex-native-v0.3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-hotfix-bytecode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact v0.3 base APK
        shell: bash
        run: |
          set -euo pipefail
          cat ci/v0.3/base64-parts/part-* | base64 --decode > /tmp/base.apk
          echo '09c607a91f29dd5977fdb67e4fa4df1f99564cb34b11e7004d5f4e14a602fa14  /tmp/base.apk' | sha256sum -c -
          unzip -tq /tmp/base.apk

      - name: Decode release bytecode
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          echo '7956eb04194300ce0d0a84ad18771eebc94b89fb8d1ddcce8ea4c056818646f4  /tmp/apktool.jar' | sha256sum -c -
          java -jar /tmp/apktool.jar d -f /tmp/base.apk -o /tmp/decoded
          mkdir -p out
          cp /tmp/decoded/AndroidManifest.xml out/
          grep -R -l -E 'Codex app-server exited|appServer|jsonrpc|chatgptDeviceCode' /tmp/decoded/smali* | tee out/matching-files.txt
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            dest="out/${f#/tmp/decoded/}"
            mkdir -p "$(dirname "$dest")"
            cp "$f" "$dest"
          done < out/matching-files.txt
          grep -R -n -E 'Codex app-server exited|appServer|jsonrpc|chatgptDeviceCode|exitValue|startDeviceLogin|readMessage' /tmp/decoded/smali* > out/grep.txt || true

      - name: Upload decoded hotfix targets
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v0.3-hotfix-bytecode
          path: out/
          if-no-files-found: error
