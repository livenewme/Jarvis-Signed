name: Inspect Jarvis v0.3 release DEX

on:
  push:
    branches: [ci/codex-native-v0.3]
    paths:
      - '.github/workflows/prepare-v0.3-unsigned.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact v0.3 base APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jarvis
          cat \
            ci/v0.3/base64-parts/part-000 \
            ci/v0.3/base64-parts/part-001 \
            ci/v0.3/base64-parts/part-002 \
            ci/v0.3/base64-parts/part-003 \
            ci/v0.3/base64-parts/part-004 \
            ci/v0.3/base64-parts/part-005a \
            ci/v0.3/base64-parts/part-005b \
            ci/v0.3/base64-parts/part-006 \
            | base64 --decode > /tmp/jarvis/base.apk
          test "$(sha256sum /tmp/jarvis/base.apk | awk '{print $1}')" = \
            '09c607a91f29dd5977fdb67e4fa4df1f99564cb34b11e7004d5f4e14a602fa14'
          unzip -tq /tmp/jarvis/base.apk
          sha256sum /tmp/jarvis/base.apk

      - name: Disassemble release DEX
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /tmp/apktool.jar' | sha256sum -c -
          java -jar /tmp/apktool.jar d -f -r /tmp/jarvis/base.apk -o /tmp/jarvis/decoded

          echo '=== Codex exitValue/error sites ==='
          grep -R -n -E 'Codex app-server exited|exitValue|jsonrpc|chatgptDeviceCode' /tmp/jarvis/decoded/smali* || true
          echo '=== matching Codex client smali ==='
          match="$(grep -R -l -F 'Codex app-server exited' /tmp/jarvis/decoded/smali* | head -n 1)"
          test -n "$match"
          echo "MATCH=$match"
          cat "$match"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$match" "$GITHUB_WORKSPACE/out/CodexAppServerClient.smali"
          cp /tmp/jarvis/base.apk "$GITHUB_WORKSPACE/out/base.apk"

      - name: Upload DEX inspection
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v0.3-dex-inspection
          path: out/
          if-no-files-found: error
