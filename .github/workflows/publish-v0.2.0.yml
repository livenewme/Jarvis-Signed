name: Publish Jarvis Android v0.2.0

on:
  push:
    branches: [release-feed]
    paths:
      - 'staging/v0.2.0/PUBLISH'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
      - name: Reconstruct and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/v0.2.0
          cat staging/v0.2.0/part-* | base64 --decode > releases/v0.2.0/Jarvis-v0.2.0-standalone-release-signed.apk
          echo 'e81761f33d09d2172de1e5ba5c2a9aba8491af1c69deec574e74ba9d9efe4cb2  releases/v0.2.0/Jarvis-v0.2.0-standalone-release-signed.apk' | sha256sum --check --strict
          unzip -t releases/v0.2.0/Jarvis-v0.2.0-standalone-release-signed.apk >/dev/null
          file releases/v0.2.0/Jarvis-v0.2.0-standalone-release-signed.apk | grep -q 'Android package (APK)'
      - name: Advance signed release feed
        shell: bash
        run: |
          set -euo pipefail
          cat > latest.json <<'JSON'
          {
            "versionName": "0.2.0",
            "versionCode": 2,
            "apkUrl": "https://raw.githubusercontent.com/livenewme/Jarvis-Signed/release-feed/releases/v0.2.0/Jarvis-v0.2.0-standalone-release-signed.apk",
            "sha256": "e81761f33d09d2172de1e5ba5c2a9aba8491af1c69deec574e74ba9d9efe4cb2",
            "releaseCertSha256": "e2384592780978342912be64664d4ed53e392d8b0cb107d99a7b47b3423bc153",
            "releaseNotes": "Jarvis now runs entirely on-device as a foreground service with a live status notification, local durable event history, direct model access, and Android Keystore-protected model credentials."
          }
          JSON
          git config user.name 'Jarvis Release Bot'
          git config user.email 'jarvis-release-bot@users.noreply.github.com'
          git add releases/v0.2.0/Jarvis-v0.2.0-standalone-release-signed.apk latest.json
          git rm -r staging/v0.2.0
          git commit -m 'Publish signed Jarvis Android v0.2.0'
          git push origin HEAD:release-feed
