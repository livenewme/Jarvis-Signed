name: Temporary export Android Build Tools 34

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-export-buildtools34.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify and stage Build Tools 34
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          if [ ! -x "$ANDROID_HOME/build-tools/34.0.0/aapt2" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;34.0.0'
          fi
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          mkdir -p out/build-tools
          cp -a "$ANDROID_HOME/build-tools/34.0.0" out/build-tools/34.0.0
      - name: Upload Build Tools 34
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-build-tools-34
          path: out/build-tools/34.0.0/
          compression-level: 9
          retention-days: 2
