name: Publish staged signed APK

on:
  push:
    branches: [release-feed]
    paths:
      - 'staging/publish-v0.1.0'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-feed
      - name: Reconstruct and verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases/v0.1.0
          cat staging/v0.1.0/part-* | base64 --decode > releases/v0.1.0/Jarvis-v0.1.0-release-signed.apk
          echo 'cc96e82df13f7248fbbe7fcfe9ad5f26bb37b461d63d25050c0c0fb11ece879c  releases/v0.1.0/Jarvis-v0.1.0-release-signed.apk' | sha256sum --check --strict
      - name: Commit verified binary release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Jarvis Release Bot'
          git config user.email 'jarvis-release-bot@users.noreply.github.com'
          git add releases/v0.1.0/Jarvis-v0.1.0-release-signed.apk
          git rm -r staging/v0.1.0 staging/publish-v0.1.0
          git commit -m 'Publish signed Jarvis Android v0.1.0'
          git push origin HEAD:release-feed
