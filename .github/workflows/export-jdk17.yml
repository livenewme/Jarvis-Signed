name: Export Jarvis JDK 17

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-jdk17.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Export JDK 17
        shell: bash
        run: |
          set -euo pipefail
          real="$(readlink -f "$JAVA_HOME")"
          test -x "$real/bin/java"
          mkdir -p out stage/jdk17
          cp -aL "$real"/. stage/jdk17/
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C stage -czf out/jarvis-jdk17.tar.gz jdk17
          sha256sum out/jarvis-jdk17.tar.gz > out/jarvis-jdk17.tar.gz.sha256
          out_check="$(stage/jdk17/bin/java -version 2>&1 | head -n1)"
          case "$out_check" in *'17.'*) ;; *) echo "wrong JDK: $out_check" >&2; exit 1;; esac
          du -h out/jarvis-jdk17.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-jdk17
          path: out/
          if-no-files-found: error
          retention-days: 7
