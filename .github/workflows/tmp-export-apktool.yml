name: Temporary export Apktool

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-export-apktool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Download pinned Apktool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 -o out/apktool_3.0.3.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  out/apktool_3.0.3.jar' | sha256sum -c -
      - name: Upload Apktool
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apktool-3.0.3
          path: out/apktool_3.0.3.jar
          compression-level: 0
          retention-days: 2
