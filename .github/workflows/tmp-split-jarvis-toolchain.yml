name: Temporary split Jarvis Android toolchain export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-split-jarvis-toolchain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Warm AGP 8.7.3 and JUnit
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/jarvis-public-cache-warm
          rm -rf "$root"
          mkdir -p "$root/app/src/main/java/example" "$root/app/src/main"
          cat > "$root/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'JarvisPublicToolchainWarmup'
          include ':app'
          EOF
          cat > "$root/build.gradle" <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > "$root/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'example.jarvis.toolchain'
              compileSdk 35
              buildToolsVersion '35.0.0'
              defaultConfig { applicationId 'example.jarvis.toolchain'; minSdk 26; targetSdk 35; versionCode 1; versionName '1' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { testImplementation 'junit:junit:4.13.2' }
          EOF
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"><application /></manifest>' > "$root/app/src/main/AndroidManifest.xml"
          echo 'package example; final class Main {}' > "$root/app/src/main/java/example/Main.java"
          cd "$root"
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease

      - name: Stage split components
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/out"
          rm -rf "$out"
          mkdir -p "$out/jdk17" "$out/gradle89" "$out/android-sdk/platforms" "$out/android-sdk/build-tools" "$out/gradle-cache/caches"
          java_home_real="$(readlink -f "$JAVA_HOME")"
          gradle_bin="$(readlink -f "$(command -v gradle)")"
          gradle_home="$(dirname "$(dirname "$gradle_bin")")"
          cp -aL "$java_home_real"/. "$out/jdk17"/
          cp -a "$gradle_home"/. "$out/gradle89"/
          cp -a "$ANDROID_HOME/platforms/android-35" "$out/android-sdk/platforms/android-35"
          cp -a "$ANDROID_HOME/build-tools/35.0.0" "$out/android-sdk/build-tools/35.0.0"
          if [ -d "$ANDROID_HOME/platform-tools" ]; then cp -a "$ANDROID_HOME/platform-tools" "$out/android-sdk/platform-tools"; fi
          cp -a "$HOME/.gradle/caches/modules-2" "$out/gradle-cache/caches/modules-2"
          printf 'java=17\ngradle=8.9\nplatform=35\nbuild_tools=35.0.0\nagp=8.7.3\n' > "$out/TOOLCHAIN.txt"
          du -sh "$out"/*

      - name: Upload JDK 17
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-jdk17-split
          path: out/jdk17/
          compression-level: 9
          retention-days: 2

      - name: Upload Gradle 8.9
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-gradle89-split
          path: out/gradle89/
          compression-level: 9
          retention-days: 2

      - name: Upload Android SDK 35
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-sdk35-split
          path: out/android-sdk/
          compression-level: 9
          retention-days: 2

      - name: Upload warmed Gradle cache
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-gradle-cache-split
          path: out/gradle-cache/
          compression-level: 9
          retention-days: 2

      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-toolchain-manifest-split
          path: out/TOOLCHAIN.txt
          retention-days: 2
